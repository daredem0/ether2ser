name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            make \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            git \
            doxygen \
            graphviz \
            gcovr \
            clang-tidy \
            cppcheck

      - name: Fetch Pico SDK
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git ${{ github.workspace }}/pico-sdk
          cd ${{ github.workspace }}/pico-sdk
          git submodule update --init

      - name: Build firmware
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Run static analysis
        run: |
          cmake --build build --target check_clang_tidy
          cmake --build build --target check_cppcheck

      - name: Build docs
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S . -B build-tests -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON
          cmake --build build-tests --target docs

      - name: Prepare docs artifact
        run: |
          set -euo pipefail
          mkdir -p docs-site

          if [ -d "build-tests/docs/doxygen/html" ]; then
            cp -a build-tests/docs/doxygen/html/. docs-site/
          elif [ -d "build/docs/doxygen/html" ]; then
            cp -a build/docs/doxygen/html/. docs-site/
          elif [ -d "docs/doxygen/html" ]; then
            cp -a docs/doxygen/html/. docs-site/
          else
            DOC_HTML="$(find build -type f -path '*/html/index.html' | head -n1 || true)"
            if [ -z "${DOC_HTML}" ]; then
              echo "Could not locate generated Doxygen HTML output."
              exit 1
            fi
            cp -a "$(dirname "${DOC_HTML}")"/. docs-site/
          fi

      - name: Upload docs artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: docs-site

      - name: Build tests
        run: |
          cmake --build build-tests

      - name: Run tests
        run: |
          ./build-tests/unit_tests

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy-docs:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
